name: Build aplikasi (Windows & Mac)

on:
  workflow_dispatch:        # tombol "Run workflow" di tab Actions
  push:
    tags: ['v*']            # atau otomatis saat membuat tag versi, mis. v1.0.1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test

      # ---------- Windows ----------
      - name: Build Windows (.exe)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      # ---------- Mac ----------
      # DMG x64 & arm64 dibuild BERGANTIAN (bukan paralel). Jika paralel, keduanya
      # me-mount volume "/Volumes/MHK Dokumen" yang sama sehingga saling bertabrakan
      # (error: background.tiff not found / hdiutil detach gagal).
      - name: Build Mac (.dmg) - bergantian per arsitektur
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # lewati tanda tangan Apple Developer
        run: |
          for ARCH in arm64 x64; do
            for TRY in 1 2 3; do
              # bersihkan volume DMG sisa dari percobaan sebelumnya
              for V in /Volumes/MHK*; do
                [ -e "$V" ] && hdiutil detach -force "$V" || true
              done
              if npx electron-builder --mac "--$ARCH" --publish never; then
                break
              fi
              if [ "$TRY" = "3" ]; then
                echo "Build DMG $ARCH gagal setelah 3 percobaan"
                exit 1
              fi
              echo "Percobaan $TRY untuk $ARCH gagal, mengulang..."
              sleep 5
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
